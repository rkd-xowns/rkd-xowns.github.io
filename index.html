<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nadogaebal</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1b1f; --muted:#5f6068; --line:#e6e6ea; --accent:#ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e10; --fg:#f2f2f5; --muted:#a0a0aa; --line:#26262b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 80px; }
  h1 { font-size:26px; margin:0 0 24px; }
  .section { font-size:14px; color:var(--muted); font-weight:600; margin:36px 0 8px; }
  .section:first-of-type { margin-top:0; }
  .links a + a { margin-left:14px; }
  .app { padding:18px 0; border-top:1px solid var(--line); }
  .app h2 { font-size:18px; margin:0 0 4px; }
  .app h2 span { color:var(--accent); }
  .app p { margin:0 0 6px; color:var(--muted); }
  a { color:var(--accent); }
  footer { margin-top:40px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>나도 개발자다</h1>
  <h2 class="section">앱</h2>
  <div class="app">
    <h2><span>1%</span></h2>
    <p>스크린샷의 배터리를 1%로 바꿔 주는 사진 편집 앱</p>
    <a href="onepercent/privacy/">개인정보처리방침</a>
  </div>
  <h2 class="section">웹</h2>
  <div class="app">
    <h2><span>수능시계</span></h2>
    <p>실제 수능 시간표와 타종에 맞춰 모의고사를 연습하는 시뮬레이터, 타이머, 스톱워치</p>
    <p class="links"><a href="https://csat-timer.vercel.app">바로 가기</a><a href="https://github.com/rkd-xowns/Csat-timer">소스 코드</a></p>
  </div>
  <footer>문의: <a href="mailto:support@nadogaebal.com">support@nadogaebal.com</a></footer>
</main>
</body>
</html>
